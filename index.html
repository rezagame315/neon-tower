<script>
(()=>{'use strict';
const channelBanner=document.getElementById('channelBanner'),channelBannerTitle=document.getElementById('channelBannerTitle'),channelToggle=document.getElementById('channelToggle');
let channelIndex=0,channelRotation=null,bannerVisible=true;
function showChannel(){if(!Array.isArray(CHANNELS)||!CHANNELS.length){channelBanner.hidden=true;channelBannerTitle.textContent='';return}const channel=CHANNELS[channelIndex%CHANNELS.length];channelBanner.href=channel.url;channelBannerTitle.textContent=channel.title;channelBanner.hidden=!bannerVisible}
window.openNextChannel=function(){if(!CHANNELS.length)return;channelIndex=(channelIndex+1)%CHANNELS.length;showChannel();window.open(CHANNELS[channelIndex].url,'_blank','noopener,noreferrer')};
function rotateChannels(){if(channelRotation)clearInterval(channelRotation);channelRotation=CHANNELS.length>1?setInterval(()=>{channelIndex=(channelIndex+1)%CHANNELS.length;showChannel()},6000):null}
channelToggle.addEventListener('click',()=>{bannerVisible=!bannerVisible;channelToggle.setAttribute('aria-expanded',String(bannerVisible));channelToggle.textContent=bannerVisible?'پنهان‌کردن بنر':'نمایش بنر کانال';showChannel()});
showChannel();rotateChannels();
})();

<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),playBtn=document.getElementById('play'),restartBtn=document.getElementById('restart'),manualAdBtn=document.getElementById('manualAd'),rewardAdBtn=document.getElementById('rewardAd'),adStatus=document.getElementById('adStatus'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),streakEl=document.getElementById('streak'),hint=document.getElementById('hint'),soundBtn=document.getElementById('sound'),soundText=document.getElementById('soundText'),titleEl=document.getElementById('overlayTitle'),textEl=document.getElementById('overlayText'),subEl=document.getElementById('subText'),emblem=document.getElementById('emblem'),finalScore=document.getElementById('finalScore'),announcement=document.getElementById('announcement');
const fa=n=>Math.floor(n).toLocaleString('fa-IR');const smallScreen=matchMedia('(max-width: 700px)').matches;let W=0,H=0,D=1,playing=false,started=false,score=0,best=0,streak=0,blocks=[],active=null,fragments=[],particles=[],floaters=[],stars=[],last=0,cam=0,camTarget=0,shake=0,perfectFlash=0,roundHue=0,audio=null,soundOn=false,previousTap=0;
// شناسه‌ها را با Block ID واقعی پنل Adsgram جایگزین کنید؛ تا آن زمان تبلیغی درخواست نمی‌شود.
const ADSGRAM_INTERSTITIAL_BLOCK_ID='YOUR_INTERSTITIAL_BLOCK_ID';
const ADSGRAM_REWARDED_BLOCK_ID='YOUR_REWARDED_BLOCK_ID';
const DAILY_AD_LIMIT=5,DAILY_AD_KEY='borjsaz-ads-'+new Date().toLocaleDateString('en-CA');
let losses=0,adBusy=false;
function dailyAds(){try{return Math.max(0,Number(localStorage.getItem(DAILY_AD_KEY))||0)}catch(_){return 0}}
function adAvailable(){return dailyAds()<DAILY_AD_LIMIT}
function updateAdControls(){const left=Math.max(0,DAILY_AD_LIMIT-dailyAds());manualAdBtn.textContent=left?'تبلیغ اختیاری · '+fa(left):'سهمیهٔ تبلیغ امروز تمام شد';manualAdBtn.disabled=adBusy||!left;rewardAdBtn.disabled=adBusy||!left;}
function adMessage(text){adStatus.textContent=text;}
function hasAdId(id){return id&&!id.startsWith('YOUR_')}
async function showAd(kind){if(adBusy)return false;const blockId=kind==='rewarded'?ADSGRAM_REWARDED_BLOCK_ID:ADSGRAM_INTERSTITIAL_BLOCK_ID;if(!hasAdId(blockId)){adMessage('برای فعال‌سازی تبلیغ، Block IDهای Adsgram را در تنظیمات فایل وارد کنید.');return false}if(!adAvailable()){adMessage('سهمیهٔ روزانهٔ تبلیغ (۵ بار) استفاده شده است.');updateAdControls();return false}if(!window.Adsgram||typeof window.Adsgram.init!=='function'){adMessage('SDK تبلیغات در دسترس نیست؛ اتصال اینترنت را بررسی کنید.');return false}adBusy=true;updateAdControls();adMessage('در حال بارگذاری تبلیغ…');try{const controller=window.Adsgram.init({blockId});let result=await controller.show();try{localStorage.setItem(DAILY_AD_KEY,String(dailyAds()+1))}catch(_){}adMessage('');return kind==='rewarded'?!!(result&&result.done):true}catch(err){adMessage('تبلیغ نمایش داده نشد؛ دوباره تلاش کنید.');return false}finally{adBusy=false;updateAdControls()}}
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}}catch(_){}
try{const et=window.Eitaa&&window.Eitaa.WebApp;if(et){et.ready();et.expand()}}catch(_){}
try{best=Number(localStorage.getItem('borjsaz-best'))||0}catch(_){}bestEl.textContent=fa(best);
function resize(){D=Math.min(window.devicePixelRatio||1,smallScreen?1.5:2);W=Math.max(1,Math.round(window.visualViewport?.width||innerWidth));H=Math.max(1,Math.round(window.visualViewport?.height||innerHeight));canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);if(!started)initStars();}
function initStars(){stars=Array.from({length:Math.max(22,Math.floor(W*H/(smallScreen?26000:18000)))},()=>({x:Math.random()*W,y:Math.random()*H,r:.35+Math.random()*1.15,a:.18+Math.random()*.6,p:Math.random()*6.28,s:.4+Math.random()*1.1}));}
function setup(){score=0;streak=0;blocks=[];fragments=[];particles=[];floaters=[];cam=camTarget=0;shake=0;perfectFlash=0;const bw=Math.min(220,Math.max(150,W*.39)),bh=Math.max(23,Math.min(31,W*.065));blocks.push({x:(W-bw)/2,y:H*.70,w:bw,h:bh,hue:195});active={x:W*.12,y:H*.70-bh,w:bw,h:bh,hue:265,v:Math.max(190,W*.62),dir:1};roundHue=265;updateHud();}
function startGame(){initAudio();started=true;playing=true;rewardAdBtn.hidden=true;adMessage('');overlay.classList.add('hidden');overlay.classList.remove('gameover');hint.style.opacity='1';setup();last=performance.now();}
function updateHud(){scoreEl.textContent=fa(score);streakEl.textContent=fa(streak);bestEl.textContent=fa(best)}
function gameOver(){if(!playing)return;playing=false;active=null;shake=8;losses++;overlay.classList.remove('hidden');overlay.classList.add('gameover');titleEl.textContent='برج لرزید!';textEl.textContent='یک لحظهٔ دقیق‌تر کافی بود تا برج بلندتر شود.';subEl.textContent='بهترینت را بشکن؛ این بار ریتم برج را پیدا کن.';emblem.textContent='✧';finalScore.textContent=`امتیازت: ${fa(score)}  ·  زنجیرهٔ عالی: ${fa(streak)}`;playBtn.textContent='دوباره بازی کن';restartBtn.hidden=false;rewardAdBtn.hidden=false;adMessage('');hint.style.opacity='.35';announce('پایان بازی. امتیاز '+score);updateAdControls();}
function initAudio(){if(!soundOn||audio)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}catch(_){}}
function tone(freq,dur=.16,when=0,vol=.055){if(!audio||!soundOn)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime+when);g.gain.setValueAtTime(.0001,audio.currentTime+when);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+when+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+when+dur);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+when);o.stop(audio.currentTime+when+dur+.03)}catch(_){}}
function perfectSong(){const notes=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];notes.forEach((n,i)=>tone(n,.22,i*.075,.045));}
function soundToggle(){soundOn=!soundOn;soundText.textContent='صدا: '+(soundOn?'روشن':'خاموش');soundBtn.setAttribute('aria-label',soundOn?'خاموش کردن صدا':'روشن کردن صدا');if(soundOn){initAudio();if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});tone(660,.1)}else if(audio){tone(240,.07)}}
soundBtn.addEventListener('click',e=>{e.stopPropagation();soundToggle()});
function announce(t){announcement.textContent='';setTimeout(()=>announcement.textContent=t,20)}
function addFloat(x,y,msg,color='#aaf6ff',big=false){floaters.push({x,y,msg,color,t:0,big})}
function burst(x,y,hue,count=22){if(smallScreen)count=Math.min(count,12);for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=55+Math.random()*240;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-75,life:.65+Math.random()*.7,max:.65+Math.random()*.7,size:2+Math.random()*4,hue:hue+Math.random()*45,spin:Math.random()*7})}}
function drop(){if(!playing||!active)return;const top=blocks[blocks.length-1],a=active;let left=Math.max(a.x,top.x),right=Math.min(a.x+a.w,top.x+top.w),overlap=right-left;const err=(a.x+a.w/2)-(top.x+top.w/2),tol=Math.max(4,Math.min(5,a.w*.025));let perfect=Math.abs(err)<=tol;
 if(overlap<=0){fragments.push({x:a.x,y:a.y,w:a.w,h:a.h,hue:a.hue,vx:a.v*0.48*a.dir,vy:-40,fall:true,alpha:1});burst(a.x+a.w/2,a.y+a.h/2,a.hue,12);tone(145,.24);gameOver();return}
 if(perfect){left=top.x;right=top.x+top.w;overlap=top.w;streak++;perfectFlash=.55;burst((left+right)/2,a.y,a.hue,22);addFloat((left+right)/2,a.y-12,streak%3===0?'عالی ×۳!':'عالی!', '#bafaff',true);perfectSong();}
 else{streak=0;const cutL=Math.max(0,top.x-a.x),cutR=Math.max(0,a.x+a.w-(top.x+top.w));if(cutL>0)fragments.push({x:a.x,y:a.y,w:cutL,h:a.h,hue:a.hue,vx:-100-Math.random()*100,vy:-20,fall:true,alpha:1});if(cutR>0)fragments.push({x:top.x+top.w,y:a.y,w:cutR,h:a.h,hue:a.hue,vx:100+Math.random()*100,vy:-20,fall:true,alpha:1});tone(360,.1);}
 let newW=overlap;if(perfect&&streak%3===0)newW=Math.min(blocks[0].w,newW+Math.max(2,blocks[0].w*.025));const nx=perfect?(left+right-newW)/2:left;blocks.push({x:nx,y:top.y-a.h,w:newW,h:a.h,hue:a.hue});score++;if(score>best){best=score;try{localStorage.setItem('borjsaz-best',String(best))}catch(_){}}updateHud();if(score%3===0){burst(nx+newW/2,top.y-a.h,a.hue,14);addFloat(nx+newW/2,top.y-a.h-6,'+'+fa(score),'#ffd5ad')}
 const speed=Math.min(680,Math.max(190,W*.62)+score*14),nextHue=(a.hue+31+Math.random()*15)%360;active={x:(a.dir>0?-newW:W),y:top.y-a.h*2,w:newW,h:a.h,hue:nextHue,v:speed,dir:a.dir>0?1:-1};if(score%2===1)active.dir=-active.dir;roundHue=nextHue;camTarget=Math.max(0,(blocks.length-4)*a.h*.78);announce(perfect?'دقیق و عالی! امتیاز '+score:'امتیاز '+score);}
function input(e){if(e){if(e.type==='pointerdown'){if(e.button!==undefined&&e.button!==0)return;e.preventDefault()} }if(!playing){if(!started||overlay.classList.contains('gameover'))startGame();return}drop()}
canvas.addEventListener('pointerdown',input,{passive:false});playBtn.addEventListener('click',startGame);restartBtn.addEventListener('click',startGame);
manualAdBtn.addEventListener('click',e=>{e.stopPropagation();window.openNextChannel();adMessage('کانال در برگهٔ جدید باز شد.')});
rewardAdBtn.addEventListener('click',e=>{e.stopPropagation();window.openNextChannel();adMessage('کانال در برگهٔ جدید باز شد.');if(!blocks.length){startGame();return}const top=blocks[blocks.length-1];active={x:0,y:top.y-top.h,w:top.w,h:top.h,hue:(roundHue+31)%360,v:Math.min(680,Math.max(190,W*.62)+score*14),dir:1};playing=true;started=true;overlay.classList.add('hidden');overlay.classList.remove('gameover');rewardAdBtn.hidden=true;hint.style.opacity='1';last=performance.now();announce('بازی ادامه پیدا کرد!')});window.addEventListener('keydown',e=>{if(['Space','Enter'].includes(e.code)){e.preventDefault();if(!e.repeat)input()}if(e.key.toLowerCase()==='r'){e.preventDefault();startGame()}});window.addEventListener('resize',resize,{passive:true});window.visualViewport?.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)last=performance.now()});
function roundedRect(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);}
function drawBlock(b,offset=0){const y=b.y+offset,glow=ctx.createLinearGradient(b.x,y,b.x+b.w,y+b.h);glow.addColorStop(0,`hsla(${b.hue},100%,78%,.98)`);glow.addColorStop(.48,`hsla(${(b.hue+31)%360},92%,62%,.98)`);glow.addColorStop(1,`hsla(${(b.hue+70)%360},95%,70%,.98)`);ctx.save();ctx.shadowColor=`hsla(${b.hue},100%,67%,.48)`;ctx.shadowBlur=smallScreen?6:14;roundedRect(ctx,b.x,y,b.w,b.h,7);ctx.fillStyle=glow;ctx.fill();ctx.shadowBlur=0;const sheen=ctx.createLinearGradient(0,y,0,y+b.h);sheen.addColorStop(0,'rgba(255,255,255,.52)');sheen.addColorStop(.28,'rgba(255,255,255,.11)');sheen.addColorStop(1,'rgba(20,20,58,.14)');roundedRect(ctx,b.x+1,y+1,b.w-2,b.h-2,6);ctx.fillStyle=sheen;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.44)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function drawTarget(){if(!active)return;const top=blocks[blocks.length-1],y=active.y+active.h+5,cy=top.y-4;ctx.save();ctx.setLineDash([4,8]);ctx.lineWidth=1;ctx.strokeStyle='rgba(141,236,255,.16)';ctx.beginPath();ctx.moveTo(Math.max(12,active.x-30),cy);ctx.lineTo(Math.min(W-12,active.x+active.w+30),cy);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='rgba(146,237,255,.45)';ctx.shadowBlur=smallScreen?0:8;ctx.shadowColor='#68e8ff';ctx.beginPath();ctx.moveTo(active.x+active.w/2,y);ctx.lineTo(active.x+active.w/2,top.y);ctx.stroke();ctx.restore()}
function drawBackground(t){ctx.clearRect(0,0,W,H);for(const s of stars){const a=s.a*(.65+.35*Math.sin(t*.001*s.s+s.p));ctx.globalAlpha=a;ctx.fillStyle='#dbeaff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();if(s.r>1){ctx.globalAlpha=a*.22;ctx.fillRect(s.x-3,s.y,s.r*6,.5)}}ctx.globalAlpha=1;let y=H*.82;const grad=ctx.createLinearGradient(0,y,0,H);grad.addColorStop(0,'rgba(82,153,206,0)');grad.addColorStop(1,'rgba(62,125,180,.12)');ctx.fillStyle=grad;ctx.fillRect(0,y,W,H-y)}
function frame(t){const dt=Math.min(.035,(t-last)/1000||0);last=t;drawBackground(t);if(playing&&active){active.x+=active.v*active.dir*dt;if(active.x+active.w>W){active.x=W-active.w;active.dir=-1}else if(active.x<0){active.x=0;active.dir=1}cam+=(camTarget-cam)*Math.min(1,dt*3.8);}
 for(const b of blocks)drawBlock(b,cam);if(active){drawTarget();drawBlock(active,cam)}
 for(let i=fragments.length-1;i>=0;i--){const f=fragments[i];f.vy+=650*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.alpha-=dt*.72;ctx.save();ctx.globalAlpha=Math.max(0,f.alpha);drawBlock(f,cam);ctx.restore();if(f.alpha<=0||f.y>H+200)fragments.splice(i,1)}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=250*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.22,dt);if(p.life<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.translate(p.x,p.y+cam);ctx.rotate(p.spin);ctx.fillStyle=`hsl(${p.hue},100%,72%)`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=smallScreen?0:7;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);ctx.restore()}
 for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;if(f.t>1.15){floaters.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.min(1,(1.15-f.t)*1.6);ctx.textAlign='center';ctx.font=`${f.big?'bold 17px':'bold 13px'} Tahoma`;ctx.shadowColor=f.color;ctx.shadowBlur=smallScreen?0:8;ctx.fillStyle=f.color;ctx.fillText(f.msg,f.x,f.y+cam-f.t*38);ctx.restore()}
 if(perfectFlash>0){perfectFlash-=dt;ctx.save();ctx.globalAlpha=Math.min(.09,perfectFlash*.15);ctx.fillStyle='#8cf8ff';ctx.fillRect(0,0,W,H);ctx.restore()}if(shake>0){shake=Math.max(0,shake-dt*28);canvas.style.transform=`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)`}else canvas.style.transform='';requestAnimationFrame(frame)}
resize();setup();updateAdControls();requestAnimationFrame(frame);
})();
